name: iOS CI Build

# 公开仓库 => macOS runner 分钟数无限，适合长期 CI。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools (XcodeGen)
        run: brew install xcodegen 2>/dev/null || true

      # 交叉编译 Unicorn (iOS arm64) 到 unicorn/prebuilt/（项目自带 make.sh）
      - name: Build Unicorn for iOS (arm64)
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x make.sh
          ./make.sh iOS 2>&1 | tee make.log

      - name: Generate Xcode project
        run: cd "$GITHUB_WORKSPACE" && xcodegen generate

      # MobileVLCKit 走 CocoaPods 二进制分发。
      - name: Install CocoaPods deps (MobileVLCKit)
        run: cd "$GITHUB_WORKSPACE" && (pod install --repo-update || pod install)
        continue-on-error: true

      # 无签名构建：仅验证 C/ObjC/Swift 能通过编译+链接（真机签名需本地证书）。
      - name: Build app (no code signing)
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d CorruptionIOS.xcworkspace ]; then
            xcodebuild -workspace CorruptionIOS.xcworkspace -scheme CorruptionIOS \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build.log
          else
            xcodebuild -project CorruptionIOS.xcodeproj -scheme CorruptionIOS \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build.log
          fi
        continue-on-error: true

      # 把编译日志 force-push 到 ci-log 分支，本机通过 SSH git fetch 即可读取，
      # 形成「推代码 -> 云端编译 -> 读日志 -> 修 -> 再推」的闭环。
      - name: Publish build log to ci-log branch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci
          {
            echo "===== MAKE.LOG ====="
            cat make.log 2>/dev/null
            echo
            echo "===== BUILD.LOG ====="
            cat build.log 2>/dev/null
          } > ci/last-run.log
          cd /tmp && rm -rf cilog && mkdir cilog && cd cilog
          git init -q
          git config user.email "ci-bot@corruption.local"
          git config user.name "ci-bot"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Aiden6652/corruption-ios-runtime.git
          mkdir -p ci
          cp "$GITHUB_WORKSPACE/ci/last-run.log" ci/last-run.log
          git add -A
          git commit -q -m "[skip ci] build log"
          git push -f origin HEAD:ci-log
