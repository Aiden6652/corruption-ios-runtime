name: iOS CI Build

# 公开仓库 => macOS runner 分钟数无限，适合长期 CI。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show env
        run: |
          { xcodebuild -version; echo "---tools---"; which xcodegen pod cmake ninja clang; echo "---os---"; uname -a; sw_vers; } > env.log 2>&1 || true

      # === 通道验证占位（确认 publish 双通道可用后，再换回真实编译步骤） ===
      - name: CHANNEL-TEST placeholder
        run: |
          echo "make ok (channel test)" > make.log
          echo "BUILD SUCCEEDED (channel test placeholder)" > build.log

      - name: Publish build log
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci
          {
            echo "===== ENV ====="; cat env.log 2>/dev/null
            echo; echo "===== MAKE.LOG (tail 80) ====="; tail -n 80 make.log 2>/dev/null
            echo; echo "===== BUILD.LOG (errors) ====="
            grep -iE "error:|fatal error|undefined symbol|ld: |Swift compile error|Build failed|BUILD FAILED|No such file or directory" build.log 2>/dev/null | head -n 80
            echo; echo "===== BUILD.LOG (tail 60) ====="; tail -n 60 build.log 2>/dev/null
          } > ci/last-run.log
          echo "===== PUBLISH: ci-log push ====="
          git config user.email "ci@corruption.local"
          git config user.name "ci-bot"
          git checkout --orphan ci-log >/dev/null 2>&1 || true
          git reset -q
          git add ci/last-run.log
          git commit -q -m "[skip ci] build log" || echo "commit skipped"
          git push -f "https://x-access-token:${TOKEN}@github.com/Aiden6652/corruption-ios-runtime.git" ci-log 2>&1 | tail -3 || echo "PUSH_FAILED"
          echo "===== PUBLISH: commit status ====="
          if grep -q "BUILD SUCCEEDED" build.log 2>/dev/null; then ST=success; else ST=failure; fi
          ERR=$(grep -iE "error:|fatal error|undefined symbol|ld: |BUILD FAILED" build.log 2>/dev/null | head -1 | cut -c1-130)
          [ -z "$ERR" ] && ERR="build finished (see ci-log branch)"
          curl -s -X POST -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Aiden6652/corruption-ios-runtime/statuses/${SHA}" \
            -d "{\"state\":\"${ST}\",\"description\":\"${ERR}\",\"context\":\"ci/build\"}" | head -c 200
          echo
